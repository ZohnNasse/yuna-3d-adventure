<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuna Adventure - Non-module Test</title>
<style>
body { margin: 0; overflow: hidden; font-family: Arial; }
#status {
  position: fixed; top: 10px; left: 10px;
  background: rgba(0,0,0,0.8); color: white;
  padding: 10px; border-radius: 8px;
  z-index: 1000; max-width: 300px;
}
#start-btn {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 20px 40px; font-size: 24px;
  background: #ff6b9d; color: white;
  border: none; border-radius: 50px;
  cursor: pointer; z-index: 1001;
}
</style>
</head>
<body>
<div id="status">Loading...</div>
<button id="start-btn">시작</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene, camera, renderer, clock;
let gameStarted = false;
let character;

function init() {
  try {
    const status = document.getElementById('status');
    status.textContent = 'Initializing Three.js...';
    
    clock = new THREE.Clock();
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    status.textContent = 'Renderer created';
    
    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);
    
    // Ground
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);
    
    // Character (simple cube)
    const charGeo = new THREE.BoxGeometry(1, 1.5, 1);
    const charMat = new THREE.MeshLambertMaterial({ color: 0xff6b9d });
    character = new THREE.Mesh(charGeo, charMat);
    character.position.set(0, 0.75, 0);
    scene.add(character);
    
    status.textContent = 'Scene ready. Press start.';
    
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (!gameStarted) return;
  
  const elapsed = clock.getElapsedTime();
  character.position.x = Math.sin(elapsed) * 5;
  character.rotation.y += 0.02;
  
  renderer.render(scene, camera);
}

init();
animate();

document.getElementById('start-btn').addEventListener('click', function() {
  this.style.display = 'none';
  gameStarted = true;
  document.getElementById('status').textContent = 'Game started! Character moving.';
});

document.getElementById('start-btn').addEventListener('touchstart', function(e) {
  e.preventDefault();
  this.style.display = 'none';
  gameStarted = true;
  document.getElementById('status').textContent = 'Game started! Character moving.';
});
</script>
</body>
</html>
