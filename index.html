<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>유나 3D 어드벤처</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  
  #hud {
    position: fixed; top: 10px; left: 10px;
    color: white; font-size: 14px; z-index: 100;
    background: rgba(0,0,0,0.6); padding: 12px 16px;
    border-radius: 12px; user-select: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  #hud div { margin: 4px 0; font-weight: 600; }
  
  #start-screen, #win-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: linear-gradient(135deg, rgba(0,0,0,0.85), rgba(20,0,40,0.85));
    color: white; font-size: 20px; text-align: center; z-index: 200;
    padding: 20px;
  }
  #start-screen h1 { font-size: 32px; margin-bottom: 10px; }
  #start-screen p, #win-screen p { margin: 10px 0; opacity: 0.8; }
  #start-screen button, #win-screen button {
    margin-top: 20px; padding: 16px 50px;
    font-size: 22px; border: none; border-radius: 50px;
    background: linear-gradient(135deg, #ff6b9d, #ff85b3);
    color: white; cursor: pointer; font-weight: 700;
    box-shadow: 0 6px 20px rgba(255,107,157,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #start-screen button:active, #win-screen button:active {
    transform: scale(0.95);
    box-shadow: 0 3px 10px rgba(255,107,157,0.3);
  }
  #win-screen { display: none; }
  #win-screen h1 { color: #FFD700; font-size: 36px; }
  
  #game-hud {
    position: fixed; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7); color: white;
    padding: 10px 15px; border-radius: 8px;
    font-family: Arial; font-size: 16px;
    z-index: 1000;
  }
  #game-message {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8); color: gold;
    padding: 20px 30px; border-radius: 15px;
    font-family: Arial; font-size: 24px;
    font-weight: bold; z-index: 1001;
    display: none;
  }
  
  #jump-btn {
    position: fixed; bottom: 20px; right: 20px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,107,157,0.5); border: 3px solid rgba(255,255,255,0.6);
    color: white; font-size: 18px; font-weight: 700;
    display: flex; justify-content: center; align-items: center;
    user-select: none; z-index: 150;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 15px rgba(255,107,157,0.3);
    cursor: pointer;
  }
  #jump-btn:active { background: rgba(255,107,157,0.8); transform: scale(0.95); }
  
  #particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 50;
  }
  @keyframes particle-fly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  @keyframes target-pulse {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  #target-marker {
    position: fixed; width: 40px; height: 40px;
    border: 3px solid rgba(255,107,157,0.8);
    border-radius: 50%;
    pointer-events: none; z-index: 60;
    animation: target-pulse 0.6s ease-out;
    display: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div>🏆 점수: <span id="score">0</span></div>
  <div>💎 수집: <span id="collected">0</span>/5</div>
  <div>🕐 시간: <span id="time">0</span>s</div>
</div>

<div id="start-screen">
  <h1>🎮 유나 3D 어드벤처</h1>
  <p>PC: WASD/화살표 이동 | Space 점프 | Shift 대시</p>
  <p>모바일: 화면 탭으로 이동 | 점프 버튼</p>
  <p>💎 보석 5개를 모두 수집하면 승리!</p>
  <button id="start-btn">시작</button>
</div>

<div id="win-screen">
  <h1>🎉 축하합니다!</h1>
  <p id="win-text"></p>
  <button id="restart-btn">다시 하기</button>
</div>

<div id="particles"></div>
<div id="target-marker"></div>
<div id="jump-btn">점프</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

let score = 0, collected = 0, startTime = 0, elapsed = 0;
let gameOver = false, gameStarted = false;
const gems = [];
let character;
const obstacles = [];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 10, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x4CAF50, 0.6);
scene.add(hemisphereLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(20, 30, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -50;
dirLight.shadow.camera.right = 50;
dirLight.shadow.camera.top = 50;
dirLight.shadow.camera.bottom = -50;
dirLight.shadow.bias = -0.0001;
scene.add(dirLight);

// Ground
const groundGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
const groundMat = new THREE.MeshPhongMaterial({ 
  color: 0x4CAF50,
  specular: 0x333333,
  shininess: 20
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grass blades
for (let i = 0; i < 500; i++) {
  const x = (Math.random() - 0.5) * 180;
  const z = (Math.random() - 0.5) * 180;
  const grassGeo = new THREE.ConeGeometry(0.05, 0.3 + Math.random() * 0.2, 4);
  const grassMat = new THREE.MeshLambertMaterial({ 
    color: new THREE.Color(0.2 + Math.random()*0.1, 0.5 + Math.random()*0.2, 0.1) 
  });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.position.set(x, 0.15, z);
  scene.add(grass);
}

// Trees
function createTree(x, z) {
  const tree = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.2, 0.4, 2.5, 8);
  const trunkMat = new THREE.MeshPhongMaterial({ color: 0x6B4423, specular: 0x222222 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.25;
  trunk.castShadow = true;
  tree.add(trunk);
  for (let layer = 0; layer < 3; layer++) {
    const leafGeo = new THREE.SphereGeometry(1.8 - layer * 0.4, 8, 6);
    const leafMat = new THREE.MeshPhongMaterial({ 
      color: new THREE.Color(0.1 + layer * 0.05, 0.4 + layer * 0.1, 0.05),
      specular: 0x222222,
      shininess: 10
    });
    const leaves = new THREE.Mesh(leafGeo, leafMat);
    leaves.position.y = 3 + layer * 0.8;
    leaves.castShadow = true;
    leaves.receiveShadow = true;
    tree.add(leaves);
  }
  tree.position.set(x, 0, z);
  scene.add(tree);
}

for (let i = 0; i < 25; i++) {
  const x = (Math.random() - 0.5) * 160;
  const z = (Math.random() - 0.5) * 160;
  if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
  createTree(x, z);
}

// Rocks (obstacles)
function createRock(x, z, size) {
  const rockGeo = new THREE.DodecahedronGeometry(size, 1);
  const pos = rockGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
    v.multiplyScalar(1 + (Math.random() - 0.5) * 0.2);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  rockGeo.computeVertexNormals();
  const rockMat = new THREE.MeshPhongMaterial({ 
    color: new THREE.Color(0.4 + Math.random()*0.2, 0.4 + Math.random()*0.2, 0.4 + Math.random()*0.2),
    specular: 0x444444,
    shininess: 15
  });
  const rock = new THREE.Mesh(rockGeo, rockMat);
  rock.position.set(x, size * 0.7, z);
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
  obstacles.push({ mesh: rock, radius: size * 1.2 });
}

for (let i = 0; i < 15; i++) {
  const x = (Math.random() - 0.5) * 100;
  const z = (Math.random() - 0.5) * 100;
  if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
  createRock(x, z, 0.3 + Math.random() * 0.5);
}

// Flowers
for (let i = 0; i < 100; i++) {
  const x = (Math.random() - 0.5) * 150;
  const z = (Math.random() - 0.5) * 150;
  const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.3, 4);
  const stemMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.set(x, 0.15, z);
  scene.add(stem);
  const colors = [0xFF6B9D, 0xFFD700, 0xFF6347, 0x9370DB, 0xFFFFFF];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const headGeo = new THREE.SphereGeometry(0.08, 6, 4);
  const headMat = new THREE.MeshLambertMaterial({ color: color });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(x, 0.35, z);
  scene.add(head);
}

// Character
function createCharacter() {
  const charGroup = new THREE.Group();
  charGroup.position.y = 0.8; // Raise so feet are on ground
  
  // Body / Torso (skin tone)
  const torsoGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.6, 12);
  const skinMat = new THREE.MeshPhongMaterial({ color: 0xFFE4D6, specular: 0xAAAAAA, shininess: 20 });
  const torso = new THREE.Mesh(torsoGeo, skinMat);
  torso.position.y = 0.9;
  torso.castShadow = true;
  charGroup.add(torso);
  
  // Dress top (pink)
  const dressTopGeo = new THREE.CylinderGeometry(0.22, 0.25, 0.35, 12);
  const dressMat = new THREE.MeshPhongMaterial({ color: 0xFF6B9D, specular: 0xFFB6C1, shininess: 40 });
  const dressTop = new THREE.Mesh(dressTopGeo, dressMat);
  dressTop.position.y = 1.0;
  dressTop.castShadow = true;
  charGroup.add(dressTop);
  
  // Dress skirt (flared)
  const skirtGeo = new THREE.CylinderGeometry(0.25, 0.45, 0.5, 12);
  const skirt = new THREE.Mesh(skirtGeo, dressMat);
  skirt.position.y = 0.65;
  skirt.castShadow = true;
  charGroup.add(skirt);
  
  // Neck
  const neckGeo = new THREE.CylinderGeometry(0.08, 0.09, 0.1, 8);
  const neck = new THREE.Mesh(neckGeo, skinMat);
  neck.position.y = 1.25;
  charGroup.add(neck);
  
  // Head
  const headGeo = new THREE.SphereGeometry(0.3, 24, 20);
  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.y = 1.55;
  head.castShadow = true;
  charGroup.add(head);
  
  // Hair - long flowing pink hair
  const hairMat = new THREE.MeshPhongMaterial({ color: 0xFF8FC1, specular: 0xFFD1E8, shininess: 80 });
  
  // Hair top
  const hairTopGeo = new THREE.SphereGeometry(0.32, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.55);
  const hairTop = new THREE.Mesh(hairTopGeo, hairMat);
  hairTop.position.y = 1.55;
  hairTop.castShadow = true;
  charGroup.add(hairTop);
  
  // Long hair strands (back)
  for (let i = 0; i < 5; i++) {
    const hairStrandGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.9, 8);
    const hairStrand = new THREE.Mesh(hairStrandGeo, hairMat);
    const angle = (i - 2) * 0.25;
    hairStrand.position.set(Math.sin(angle) * 0.2, 1.1, -Math.cos(angle) * 0.2);
    hairStrand.rotation.x = 0.1;
    hairStrand.castShadow = true;
    charGroup.add(hairStrand);
  }
  
  // Hair bangs (front)
  for (let i = 0; i < 4; i++) {
    const bangGeo = new THREE.SphereGeometry(0.08, 8, 8);
    const bang = new THREE.Mesh(bangGeo, hairMat);
    const angle = (i - 1.5) * 0.3;
    bang.position.set(Math.sin(angle) * 0.15, 1.7, 0.25);
    bang.scale.set(1, 1.3, 0.6);
    charGroup.add(bang);
  }
  
  // Eyes (big anime style)
  const eyeWhiteGeo = new THREE.SphereGeometry(0.08, 16, 12);
  const eyeWhiteMat = new THREE.MeshPhongMaterial({ color: 0xFFFFFF, specular: 0xFFFFFF, shininess: 100 });
  const irisGeo = new THREE.SphereGeometry(0.045, 12, 8);
  const irisMat = new THREE.MeshPhongMaterial({ color: 0x8B5CF6, specular: 0xFFFFFF, shininess: 80 }); // purple eyes
  const pupilGeo = new THREE.SphereGeometry(0.02, 8, 6);
  const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const eyeHighlightGeo = new THREE.SphereGeometry(0.012, 6, 4);
  const eyeHighlightMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  
  // Left eye
  const leftEyeWhite = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
  leftEyeWhite.position.set(-0.1, 1.58, 0.27);
  leftEyeWhite.scale.set(1, 1.2, 0.6);
  charGroup.add(leftEyeWhite);
  const leftIris = new THREE.Mesh(irisGeo, irisMat);
  leftIris.position.set(-0.1, 1.58, 0.31);
  charGroup.add(leftIris);
  const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
  leftPupil.position.set(-0.1, 1.58, 0.33);
  charGroup.add(leftPupil);
  const leftHighlight = new THREE.Mesh(eyeHighlightGeo, eyeHighlightMat);
  leftHighlight.position.set(-0.11, 1.6, 0.33);
  charGroup.add(leftHighlight);
  
  // Right eye
  const rightEyeWhite = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
  rightEyeWhite.position.set(0.1, 1.58, 0.27);
  rightEyeWhite.scale.set(1, 1.2, 0.6);
  charGroup.add(rightEyeWhite);
  const rightIris = new THREE.Mesh(irisGeo, irisMat);
  rightIris.position.set(0.1, 1.58, 0.31);
  charGroup.add(rightIris);
  const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
  rightPupil.position.set(0.1, 1.58, 0.33);
  charGroup.add(rightPupil);
  const rightHighlight = new THREE.Mesh(eyeHighlightGeo, eyeHighlightMat);
  rightHighlight.position.set(0.09, 1.6, 0.33);
  charGroup.add(rightHighlight);
  
  // Eyelashes
  const lashGeo = new THREE.CylinderGeometry(0.004, 0.004, 0.05, 4);
  const lashMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 3; i++) {
      const lash = new THREE.Mesh(lashGeo, lashMat);
      const angle = (i - 1) * 0.3;
      lash.position.set(side * 0.1, 1.65, 0.3);
      lash.rotation.x = -1.2;
      lash.rotation.z = angle;
      charGroup.add(lash);
    }
  }
  
  // Nose (tiny)
  const noseGeo = new THREE.SphereGeometry(0.025, 8, 6);
  const nose = new THREE.Mesh(noseGeo, skinMat);
  nose.position.set(0, 1.53, 0.3);
  charGroup.add(nose);
  
  // Mouth (small smile)
  const smileGeo = new THREE.TorusGeometry(0.04, 0.01, 4, 8, Math.PI);
  const smileMat = new THREE.MeshBasicMaterial({ color: 0xE8707A });
  const smile = new THREE.Mesh(smileGeo, smileMat);
  smile.position.set(0, 1.48, 0.29);
  smile.rotation.x = Math.PI;
  charGroup.add(smile);
  
  // Cheeks (rosy)
  const cheekGeo = new THREE.SphereGeometry(0.06, 10, 8);
  const cheekMat = new THREE.MeshBasicMaterial({ color: 0xFFB6C1, transparent: true, opacity: 0.4 });
  const leftCheek = new THREE.Mesh(cheekGeo, cheekMat);
  leftCheek.position.set(-0.18, 1.52, 0.24);
  leftCheek.scale.set(1.2, 0.7, 0.5);
  charGroup.add(leftCheek);
  const rightCheek = new THREE.Mesh(cheekGeo, cheekMat);
  rightCheek.position.set(0.18, 1.52, 0.24);
  rightCheek.scale.set(1.2, 0.7, 0.5);
  charGroup.add(rightCheek);
  
  // Arms
  const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8);
  const leftArm = new THREE.Mesh(armGeo, skinMat);
  leftArm.position.set(-0.28, 0.95, 0);
  leftArm.rotation.z = 0.3;
  leftArm.castShadow = true;
  charGroup.add(leftArm);
  const rightArm = new THREE.Mesh(armGeo, skinMat);
  rightArm.position.set(0.28, 0.95, 0);
  rightArm.rotation.z = -0.3;
  rightArm.castShadow = true;
  charGroup.add(rightArm);
  
  // Hands
  const handGeo = new THREE.SphereGeometry(0.06, 8, 6);
  const leftHand = new THREE.Mesh(handGeo, skinMat);
  leftHand.position.set(-0.32, 0.75, 0);
  charGroup.add(leftHand);
  const rightHand = new THREE.Mesh(handGeo, skinMat);
  rightHand.position.set(0.32, 0.75, 0);
  charGroup.add(rightHand);
  
  // Legs
  const legGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.5, 8);
  const leftLeg = new THREE.Mesh(legGeo, skinMat);
  leftLeg.position.set(-0.1, 0.35, 0);
  leftLeg.castShadow = true;
  charGroup.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeo, skinMat);
  rightLeg.position.set(0.1, 0.35, 0);
  rightLeg.castShadow = true;
  charGroup.add(rightLeg);
  
  // Shoes
  const shoeGeo = new THREE.BoxGeometry(0.1, 0.08, 0.14);
  const shoeMat = new THREE.MeshPhongMaterial({ color: 0xFFB6C1, specular: 0xFFFFFF, shininess: 60 });
  const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
  leftShoe.position.set(-0.1, 0.08, 0.02);
  charGroup.add(leftShoe);
  const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
  rightShoe.position.set(0.1, 0.08, 0.02);
  charGroup.add(rightShoe);
  
  // Hair bow
  const bowGeo = new THREE.SphereGeometry(0.08, 8, 6);
  const bowMat = new THREE.MeshPhongMaterial({ color: 0xFFB6C1, specular: 0xFFFFFF, shininess: 100 });
  const bow = new THREE.Mesh(bowGeo, bowMat);
  bow.position.set(0.2, 1.78, 0);
  bow.scale.set(1.5, 0.5, 1);
  charGroup.add(bow);
  
  // Sparkles around character
  const sparkleGeo = new THREE.OctahedronGeometry(0.03, 0);
  const sparkleMat = new THREE.MeshBasicMaterial({ 
    color: 0xFFFFFF,
    transparent: true,
    opacity: 0.8
  });
  for (let i = 0; i < 5; i++) {
    const sparkle = new THREE.Mesh(sparkleGeo, sparkleMat);
    const angle = (i / 5) * Math.PI * 2;
    sparkle.position.set(
      Math.cos(angle) * 0.7,
      1.0 + Math.sin(angle) * 0.3,
      Math.sin(angle) * 0.5
    );
    charGroup.add(sparkle);
  }
  
  charGroup.userData.isCharacter = true;
  charGroup.userData.sparkles = [];
  charGroup.children.forEach(c => { if (c.geometry && c.geometry.type === 'OctahedronGeometry') charGroup.userData.sparkles.push(c); });
  return charGroup;
}

character = createCharacter();
setup_number_trees();
scene.add(character);

// Gems
const gemGeo = new THREE.OctahedronGeometry(0.5, 1);
const gemPositions = [
  [10, 1, 10], [-10, 1, 10], [10, 1, -10],
  [-10, 1, -10], [0, 1, 15]
];

gemPositions.forEach(pos => {
  const gemMat = new THREE.MeshPhongMaterial({
    color: 0xFFD700,
    emissive: 0xFFA500,
    emissiveIntensity: 0.4,
    specular: 0xFFFFFF,
    shininess: 100,
    transparent: true,
    opacity: 0.9
  });
  const gem = new THREE.Mesh(gemGeo, gemMat);
  gem.position.set(pos[0], pos[1], pos[2]);
  gem.castShadow = true;
  scene.add(gem);
  
  const ringGeo = new THREE.RingGeometry(0.6, 0.7, 16);
  const ringMat = new THREE.MeshBasicMaterial({ 
    color: 0xFFD700, 
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.5
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(pos[0], 0.1, pos[2]);
  ring.rotation.x = -Math.PI / 2;
  scene.add(ring);
  
  gems.push({ mesh: gem, ring: ring, collected: false, baseY: pos[1] });
});

// Movement target
let moveTarget = null;
let moving = false;

// PC keyboard controls
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch to move
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onGroundClick(event) {
  if (!gameStarted || gameOver) return;
  
  // Skip if clicking on UI
  if (event.target !== renderer.domElement) return;
  
  const x = event.clientX || (event.touches && event.touches[0].clientX);
  const y = event.clientY || (event.touches && event.touches[0].clientY);
  
  mouse.x = (x / window.innerWidth) * 2 - 1;
  mouse.y = -(y / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  // Intersect with ground plane
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, target);
  
  if (target) {
    moveTarget = target;
    moving = true;
    
    // Show target marker
    const marker = document.getElementById('target-marker');
    // Project to screen coords
    const screenPos = target.clone().project(camera);
    const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
    marker.style.left = (sx - 20) + 'px';
    marker.style.top = (sy - 20) + 'px';
    marker.style.display = 'block';
    setTimeout(() => { marker.style.display = 'none'; }, 600);
  }
}

// Particles
const particlesContainer = document.getElementById('particles');
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.style.cssText = 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: 8px; height: 8px; border-radius: 50%; background: ' + color + '; pointer-events: none; z-index: 50; animation: particle-fly 0.8s ease-out forwards;';
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 50;
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    particlesContainer.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

let clock = new THREE.Clock();

function checkCollisions(newX, newZ) {
  for (const obs of obstacles) {
    const dx = newX - obs.mesh.position.x;
    const dz = newZ - obs.mesh.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < obs.radius + 0.5) {
      return true;
    }
  }
  return false;
}

function update(delta) {
  if (!gameStarted || gameOver) return;

  elapsed = clock.getElapsedTime() - startTime;
  document.getElementById('time').textContent = Math.floor(elapsed);

  const speed = 8;
  let moved = false;
  let moveDir = { x: 0, z: 0 };

  // PC keyboard
  if (keys['KeyW'] || keys['ArrowUp']) { moveDir.z = -1; moved = true; }
  if (keys['KeyS'] || keys['ArrowDown']) { moveDir.z = 1; moved = true; }
  if (keys['KeyA'] || keys['ArrowLeft']) { moveDir.x = -1; moved = true; }
  if (keys['KeyD'] || keys['ArrowRight']) { moveDir.x = 1; moved = true; }

  // Touch move target
  if (moveTarget && moving) {
    const dx = moveTarget.x - character.position.x;
    const dz = moveTarget.z - character.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    
    if (dist > 0.5) {
      moveDir.x = dx / dist;
      moveDir.z = dz / dist;
      moved = true;
    } else {
      moving = false;
      moveTarget = null;
    }
  }

  if (moved) {
    const length = Math.sqrt(moveDir.x * moveDir.x + moveDir.z * moveDir.z);
    moveDir.x /= length;
    moveDir.z /= length;

    character.rotation.y = Math.atan2(moveDir.x, moveDir.z);

    const newX = character.position.x + moveDir.x * speed * delta;
    const newZ = character.position.z + moveDir.z * speed * delta;

    if (!checkCollisions(newX, character.position.z)) {
      character.position.x = newX;
    }
    if (!checkCollisions(character.position.x, newZ)) {
      character.position.z = newZ;
    }
  }

  // Gravity
  characterVelocity.y -= 25 * delta;
  character.position.y += characterVelocity.y * delta;

  if (character.position.y <= 0) {
    character.position.y = 0;
    characterVelocity.y = 0;
    isJumping = false;
  }

  // Camera follow
  const targetX = character.position.x;
  const targetZ = character.position.z + 12;
  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.z += (targetZ - camera.position.z) * 0.05;
  camera.position.y = 10;
  camera.lookAt(character.position.x, character.position.y + 1, character.position.z);

  // Bounce animation
  if (moved && !isJumping) {
    const bounce = Math.sin(clock.getElapsedTime() * 15) * 0.05;
    character.children[0].position.y = 0.5 + bounce;
  }

  // Sparkles
  character.children.forEach((child, i) => {
    if (i >= 9 && child.userData.angle !== undefined) {
      child.rotation.y += delta * child.userData.speed;
      const t = clock.getElapsedTime() * child.userData.speed;
      child.position.y = 0.5 + Math.sin(t + child.userData.angle) * 0.3;
    }
  });

  // Gems
  gems.forEach(gem => {
    if (gem.collected) return;

    gem.mesh.rotation.y += delta * 3;
    gem.mesh.rotation.x += delta * 1.5;
    gem.mesh.position.y = gem.baseY + Math.sin(clock.getElapsedTime() * 2.5) * 0.3;
    gem.ring.rotation.z += delta * 0.5;
    gem.ring.material.opacity = 0.3 + Math.sin(clock.getElapsedTime() * 2) * 0.2;

    const dist = character.position.distanceTo(gem.mesh.position);
    if (dist < 1.5) {
      gem.collected = true;
      gem.mesh.visible = false;
      gem.ring.visible = false;
      collected++;
      score += 100;
      document.getElementById('score').textContent = score;
      document.getElementById('collected').textContent = collected;

      const screenPos = gem.mesh.position.clone().project(camera);
      const sx = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
      spawnParticles(sx, sy, 20, '#FFD700');

      if (collected >= 5) {
        gameOver = true;
        const winScreen = document.getElementById('win-screen');
        winScreen.style.display = 'flex';
        const bonus = Math.max(0, 1000 - elapsed * 10);
        score += bonus;
        document.getElementById('score').textContent = score;
        document.getElementById('win-text').textContent =
          Math.floor(elapsed) + '초 만에 모든 보석을 수집했습니다! 점수: ' + score;
        spawnParticles(window.innerWidth/2, window.innerHeight/2, 50, '#FFD700');
      }
    }
  });

  // Boundary
  if (Math.abs(character.position.x) > 90) character.position.x = Math.sign(character.position.x) * 90;
  if (Math.abs(character.position.z) > 90) character.position.z = Math.sign(character.position.z) * 90;
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  update(delta);
  if (window.number_trees) { window.number_trees.update(); }
update_fruits(); collect_fruits_near_player(); update_sparkles();
  renderer.render(scene, camera);
}

// Number fruit trees
let current_sum = 0;
let number_trees = [];
const fruits = [];

function create_number_tree(x, z) {
    const group = new THREE.Group();
    
    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.5, 8);
    const trunkMat = new THREE.MeshPhongMaterial({ color: 0x8B4513, specular: 0x333333, shininess: 20 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 0.75;
    trunk.castShadow = true;
    group.add(trunk);
    
    const leavesGeo = new THREE.SphereGeometry(0.8, 16, 12);
    const leavesMat = new THREE.MeshPhongMaterial({ color: 0x228B22, specular: 0x55FF55, shininess: 30 });
    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.y = 1.8;
    leaves.castShadow = true;
    group.add(leaves);
    
    group.position.set(x, 0, z);
    group.userData.lastShake = 0;
    group.userData.isFruitTree = true;
    scene.add(group);
    
    return group;
}

function shake_tree(tree) {
    const now = Date.now();
    if (now - tree.userData.lastShake < 2000) return false;
    tree.userData.lastShake = now;
    
    const origX = tree.position.x;
    const shakeDuration = 500;
    const shakeStart = Date.now();
    
    function animateShake() {
        const elapsed = Date.now() - shakeStart;
        if (elapsed < shakeDuration) {
            const intensity = (shakeDuration - elapsed) / shakeDuration * 0.1;
            tree.position.x = origX + (Math.random() - 0.5) * intensity;
            requestAnimationFrame(animateShake);
        } else {
            tree.position.x = origX;
        }
    }
    animateShake();
    
    const numFruits = Math.floor(Math.random() * 3) + 1;
    for (let i = 0; i < numFruits; i++) {
        spawn_fruit(tree);
    }
    return true;
}

function spawn_fruit(tree) {
    const value = Math.floor(Math.random() * 9) + 1;
    
    const fruitGeo = new THREE.SphereGeometry(0.15, 12, 8);
    const fruitMat = new THREE.MeshPhongMaterial({ 
        color: 0xFF6B6B, 
        specular: 0xFFFFFF, 
        shininess: 80,
        emissive: 0x331111
    });
    const fruit = new THREE.Mesh(fruitGeo, fruitMat);
    
    const offset = (Math.random() - 0.5) * 1.5;
    fruit.position.set(
        tree.position.x + offset,
        2.0,
        tree.position.z + (Math.random() - 0.5) * 1.5
    );
    
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(255, 215, 0, 0.9)';
    ctx.beginPath();
    ctx.arc(32, 32, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(value), 32, 32);
    
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: texture });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.set(0, 0.25, 0);
    sprite.scale.set(0.4, 0.4, 1);
    fruit.add(sprite);
    
    fruit.castShadow = true;
    fruit.userData.value = value;
    fruit.userData.vy = 0;
    fruit.userData.groundY = 0.15;
    fruit.userData.lifetime = 5000;
    fruit.userData.created = Date.now();
    
    scene.add(fruit);
    fruits.push(fruit);
    
    return fruit;
}

function update_fruits() {
    const now = Date.now();
    for (let i = fruits.length - 1; i >= 0; i--) {
        const fruit = fruits[i];
        
        if (fruit.position.y > fruit.userData.groundY) {
            fruit.userData.vy -= 0.001;
            fruit.position.y += fruit.userData.vy;
        } else {
            fruit.position.y = fruit.userData.groundY;
            fruit.userData.vy = 0;
        }
        
        if (now - fruit.userData.created > fruit.userData.lifetime) {
            scene.remove(fruit);
            fruits.splice(i, 1);
        }
    }
}

function collect_fruits_near_player() {
    let collected = 0;
    for (let i = fruits.length - 1; i >= 0; i--) {
        const fruit = fruits[i];
        const dist = Math.sqrt(
            (character.position.x - fruit.position.x) ** 2 +
            (character.position.z - fruit.position.z) ** 2
        );
        if (dist < 0.8) {
            collected += fruit.userData.value;
            create_sparkles(fruit.position.x, fruit.position.y, fruit.position.z, 0xFFD700, 8);
            scene.remove(fruit);
            fruits.splice(i, 1);
        }
    }
    
    if (collected > 0) {
        current_sum += collected;
        score += collected;
        update_hud();
        
        if (current_sum >= 10) {
            score += 50;
            show_message("🎉 10 만들었다!");
            current_sum = 0;
        }
    }
    return collected;
}

function update_hud() {
    let hud = document.getElementById('game-hud');
    if (!hud) {
        hud = document.createElement('div');
        hud.id = 'game-hud';
        hud.style.position = 'fixed';
        hud.style.top = '10px';

        hud.style.background = 'rgba(0,0,0,0.7)';
        hud.style.color = 'white';
        hud.style.padding = '10px 15px';
        hud.style.borderRadius = '8px';

        hud.style.zIndex = '1000';

    }
    hud.innerHTML = '<div>🌳 현재 합: ' + current_sum + '/10</div><div>🏆 점수: ' + score + '</div>';
}

}

function create_sparkles(x, y, z, color, count) {
    for (let i = 0; i < count; i++) {
        const sparkleGeo = new THREE.OctahedronGeometry(0.05, 0);
        const sparkleMat = new THREE.MeshBasicMaterial({ 
            color: color,
            transparent: true,
            opacity: 1.0
        });
        const sparkle = new THREE.Mesh(sparkleGeo, sparkleMat);
        sparkle.position.set(x, y, z);
        
        const angle = (i / count) * Math.PI * 2;
        const speed = 0.02 + Math.random() * 0.02;
        sparkle.userData.vx = Math.cos(angle) * speed;
        sparkle.userData.vy = 0.01 + Math.random() * 0.02;
        sparkle.userData.vz = Math.sin(angle) * speed;
        sparkle.userData.lifetime = 1000;
        sparkle.userData.created = Date.now();
        scene.add(sparkle);
    }
}

function update_sparkles() {
    const now = Date.now();
    const toRemove = [];
    scene.traverse((obj) => {
        if (obj.userData && obj.userData.lifetime && obj.userData.created) {
            if (now - obj.userData.created > obj.userData.lifetime) {
                toRemove.push(obj);
            } else if (obj.userData.vx) {
                obj.position.x += obj.userData.vx;
                obj.position.y += obj.userData.vy;
                obj.position.z += obj.userData.vz;
                obj.userData.vy -= 0.0005;
            }
        }
    });
    toRemove.forEach(obj => { scene.remove(obj); });
}

function shake_nearest_tree() {
    let nearest = null;
    let nearestDist = Infinity;
    for (const tree of number_trees) {
        const dist = Math.sqrt(
            (character.position.x - tree.position.x) ** 2 +
            (character.position.z - tree.position.z) ** 2
        );
        if (dist < nearestDist && dist < 3.0) {
            nearest = tree;
            nearestDist = dist;
        }
    }
    if (nearest) {
        shake_tree(nearest);
    }
}

function setup_number_trees() {
    number_trees.push(create_number_tree(12, 5));
    number_trees.push(create_number_tree(-8, 10));
    number_trees.push(create_number_tree(5, -12));
    show_message("🌳 나무에走近해서 S 키로 흔들면 열매가 떨어져요!");
}

document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 's' && !e.shiftKey && !e.ctrlKey && !e.altKey && !moving) {
        shake_nearest_tree();
    }
});
