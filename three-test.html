<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Test</title>
<style>
body { margin: 0; overflow: hidden; }
#status {
  position: fixed; top: 10px; left: 10px;
  background: rgba(0,0,0,0.8); color: white;
  padding: 10px; border-radius: 8px; font-family: Arial;
  z-index: 1000;
}
</style>
</head>
<body>
<div id="status">Loading Three.js...</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
try {
  const status = document.getElementById('status');
  status.textContent = 'Three.js loaded. Creating scene...';
  
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x44ff44);
  
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);
  
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);
  
  const light = new THREE.AmbientLight(0xffffff);
  scene.add(light);
  
  status.textContent = 'Scene created. Rendering...';
  
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();
  
  status.textContent = 'Success! Rotating red cube on green background.';
} catch(e) {
  document.getElementById('status').textContent = 'Error: ' + e.message;
  console.error(e);
}
</script>
</body>
</html>
